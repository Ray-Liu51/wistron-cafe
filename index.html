<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── 安全設定 ──────────────────────────────
const MAX_LOGIN_ATTEMPTS = 5;       // 最多嘗試次數
const LOCKOUT_MINUTES    = 15;      // 鎖定分鐘數
const SESSION_MINUTES    = 120;     // Session 逾時（分鐘）
const SALT               = "WIS387"; // 密碼雜湊鹽值

// ── 簡易密碼雜湊（SHA-256 via SubtleCrypto）──
async function hashPass(pass) {
  const buf = await crypto.subtle.digest("SHA-256",
    new TextEncoder().encode(SALT + pass));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ── 預設資料 ──────────────────────────────
const DEFAULT_ITEMS = [
  { id:"i1", name:"咖啡豆", unit:"包", price:280, stock:100, warn:20 },
  { id:"i2", name:"牛奶球", unit:"顆", price:3,   stock:5000,warn:500 },
  { id:"i3", name:"糖包",   unit:"包", price:1,   stock:800, warn:100 },
  { id:"i4", name:"攪拌棒", unit:"支", price:2,   stock:300, warn:50  },
  { id:"i5", name:"紙杯",   unit:"個", price:1.5, stock:600, warn:100 },
];
const MACHINES = ["WIS-B1-001","WIS-1F-002","WIS-2F-003","WIS-3F-004"];

// ── 顏色 ──────────────────────────────────
const C={espresso:"#1a0f07",roast:"#3b1f0e",caramel:"#c47a2b",cream:"#f5ead8",gold:"#e8a94a",muted:"#8a7260",danger:"#c0392b",safe:"#27ae60",warn:"#e67e22"};
const mono={fontFamily:"'DM Mono',monospace"};
const serif={fontFamily:"'Playfair Display',serif"};

// ── 元件 ──────────────────────────────────
function Tag({label,type}){
  const cfg={safe:{bg:"rgba(39,174,96,.15)",color:"#2ecc71",border:"rgba(39,174,96,.3)"},warn:{bg:"rgba(230,126,34,.15)",color:"#e67e22",border:"rgba(230,126,34,.3)"},danger:{bg:"rgba(192,57,43,.15)",color:"#e74c3c",border:"rgba(192,57,43,.3)"}}[type]||{bg:"rgba(255,255,255,.08)",color:"#f5ead8",border:"rgba(255,255,255,.15)"};
  return <span style={{display:"inline-block",padding:"3px 10px",borderRadius:20,fontSize:".68rem",...mono,background:cfg.bg,color:cfg.color,border:`1px solid ${cfg.border}`}}>{label}</span>;
}
function StockBar({pct}){
  const color=pct>40?`linear-gradient(90deg,${C.safe},#2ecc71)`:pct>20?`linear-gradient(90deg,${C.warn},#f39c12)`:`linear-gradient(90deg,${C.danger},#e74c3c)`;
  return <div style={{flex:1,height:5,background:"rgba(255,255,255,.08)",borderRadius:3,overflow:"hidden",minWidth:60}}><div style={{width:`${pct}%`,height:"100%",background:color,borderRadius:3,transition:"width .5s"}}/></div>;
}
function Card({title,hint,children,style}){
  return <div style={{background:"linear-gradient(145deg,rgba(59,31,14,.65),rgba(26,15,7,.5))",border:"1px solid rgba(196,122,43,.18)",borderRadius:16,overflow:"hidden",marginBottom:22,...style}}>
    {(title||hint)&&<div style={{padding:"16px 22px 13px",borderBottom:"1px solid rgba(196,122,43,.1)",display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontSize:".93rem",fontWeight:600,color:C.cream}}>{title}</span><span style={{fontSize:".7rem",color:C.muted,...mono}}>{hint}</span></div>}
    {children}
  </div>;
}
function QInput({value,onChange,placeholder,type="text",style,disabled}){
  const [show,setShow]=useState(false);
  const isPass=type==="password";
  return <div style={{position:"relative"}}>
    <input type={isPass?(show?"text":"password"):type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} disabled={disabled}
      style={{width:"100%",background:disabled?"rgba(255,255,255,.03)":"rgba(255,255,255,.06)",border:"1px solid rgba(196,122,43,.22)",borderRadius:9,padding:isPass?"10px 40px 10px 14px":"10px 14px",color:C.cream,fontSize:".9rem",outline:"none",...mono,...style}}/>
    {isPass&&<button type="button" onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.muted,fontSize:"1rem",padding:"2px 4px",lineHeight:1}}>
      {show?"🙈":"👁️"}
    </button>}
  </div>;
}
function Btn({onClick,children,color="caramel",style,disabled}){
  const bg={caramel:`linear-gradient(135deg,${C.caramel},${C.gold})`,green:"linear-gradient(135deg,#27ae60,#2ecc71)",red:`linear-gradient(135deg,${C.danger},#e74c3c)`,ghost:"rgba(255,255,255,.06)"}[color];
  const tc=color==="ghost"?C.cream:color==="caramel"?C.espresso:"#fff";
  return <button onClick={onClick} disabled={disabled} style={{padding:"10px 22px",background:disabled?"rgba(255,255,255,.05)":bg,border:color==="ghost"?"1px solid rgba(255,255,255,.14)":"none",borderRadius:9,color:disabled?C.muted:tc,fontWeight:700,fontSize:".87rem",cursor:disabled?"not-allowed":"pointer",fontFamily:"'Noto Serif TC',serif",opacity:disabled?.6:1,...style}}>{children}</button>;
}
function SmBtn({onClick,children,color="edit"}){
  const cfg={edit:{bg:"rgba(196,122,43,.1)",border:"rgba(196,122,43,.4)",color:C.gold},rst:{bg:"rgba(39,174,96,.1)",border:"rgba(39,174,96,.4)",color:"#2ecc71"},del:{bg:"rgba(192,57,43,.1)",border:"rgba(192,57,43,.4)",color:"#e74c3c"},blue:{bg:"rgba(52,152,219,.1)",border:"rgba(52,152,219,.4)",color:"#3498db"}}[color];
  return <button onClick={onClick} style={{padding:"5px 12px",background:cfg.bg,border:`1px solid ${cfg.border}`,borderRadius:6,color:cfg.color,fontSize:".72rem",cursor:"pointer",...mono}}>{children}</button>;
}
function Toast({msg,type="info"}){
  const bg=type==="error"?"rgba(192,57,43,.95)":type==="success"?"rgba(39,130,60,.95)":C.roast;
  return <div style={{position:"fixed",bottom:28,right:28,zIndex:300,background:bg,border:`1px solid ${C.caramel}`,borderRadius:12,padding:"13px 20px",color:C.cream,fontSize:".88rem",boxShadow:"0 8px 32px rgba(0,0,0,.5)",maxWidth:320,opacity:msg?1:0,transform:msg?"translateY(0)":"translateY(16px)",transition:"all .3s",pointerEvents:"none"}}>{msg}</div>;
}
function Modal({title,body,onOk,onClose,okLabel="確認",okColor="caramel"}){
  if(!title)return null;
  return <div onClick={e=>{if(e.target===e.currentTarget)onClose();}} style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,.72)",backdropFilter:"blur(5px)",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{background:`linear-gradient(145deg,${C.roast},#1e0e06)`,border:"1px solid rgba(196,122,43,.35)",borderRadius:16,padding:30,width:"min(480px,92vw)",boxShadow:"0 24px 60px rgba(0,0,0,.65)"}}>
      <div style={{...serif,fontSize:"1.2rem",color:C.gold,marginBottom:14}}>{title}</div>
      <div style={{color:C.muted,fontSize:".87rem",lineHeight:1.7,marginBottom:18}}>{body}</div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={onClose} style={{padding:"9px 18px",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:8,color:C.muted,cursor:"pointer",...mono,fontSize:".8rem"}}>取消</button>
        <button onClick={onOk} style={{padding:"9px 18px",background:okColor==="red"?`linear-gradient(135deg,${C.danger},#e74c3c)`:`linear-gradient(135deg,${C.caramel},${C.gold})`,border:"none",borderRadius:8,color:okColor==="red"?"#fff":C.espresso,fontWeight:700,cursor:"pointer",...mono,fontSize:".8rem"}}>{okLabel}</button>
      </div>
    </div>
  </div>;
}

// ── 密碼強度檢查 ───────────────────────────
function PasswordStrength({pass}){
  if(!pass) return null;
  const checks=[pass.length>=8, /[A-Z]/.test(pass), /[0-9]/.test(pass), /[^A-Za-z0-9]/.test(pass)];
  const score=checks.filter(Boolean).length;
  const label=["太短","弱","普通","強","非常強"][score];
  const color=["#e74c3c","#e74c3c","#e67e22","#f1c40f","#2ecc71"][score];
  return <div style={{marginTop:6}}>
    <div style={{display:"flex",gap:4,marginBottom:4}}>
      {checks.map((ok,i)=><div key={i} style={{flex:1,height:3,borderRadius:2,background:i<score?color:"rgba(255,255,255,.1)",transition:"background .3s"}}/>)}
    </div>
    <div style={{fontSize:".68rem",...mono,color}}>{label}：{[
      pass.length<8?"需8字以上":"✓ 8字以上",
      !/[A-Z]/.test(pass)?"需含大寫":"✓ 含大寫",
      !/[0-9]/.test(pass)?"需含數字":"✓ 含數字",
      !/[^A-Za-z0-9]/.test(pass)?"建議含符號":"✓ 含符號",
    ].join(" · ")}</div>
  </div>;
}

// ══════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════
function App(){
  const [ready,       setReady]       = useState(false);
  const [screen,      setScreen]      = useState("login");
  const [page,        setPage]        = useState("supply");
  const [currentUser, setCurrentUser] = useState(null);
  const [items,       setItems]       = useState([]);
  const [users,       setUsers]       = useState([]);
  const [records,     setRecords]     = useState([]);
  const [toast,       setToast]       = useState({msg:"",type:"info"});
  const [modal,       setModal]       = useState(null);
  const sessionTimer  = useRef(null);

  // 登入表單
  const [loginUser,  setLoginUser]  = useState("");
  const [loginPass,  setLoginPass]  = useState("");
  const [loginFloor, setLoginFloor] = useState("B1F");
  const [loginErr,   setLoginErr]   = useState("");
  const [showLoginPass, setShowLoginPass] = useState(false);
  const [loginAttempts, setLoginAttempts] = useState(0);

  const [lockUntil,  setLockUntil]  = useState(null);
  const [iName,setIName]=useState("");const [iUnit,setIUnit]=useState("");const [iPrice,setIPrice]=useState("");const [iWarn,setIWarn]=useState("");const [iStock,setIStock]=useState("");
  // 領用表單
  const [reqQtys,setReqQtys]=useState({});const [reqMach,setReqMach]=useState(MACHINES[0]);const [reqNote,setReqNote]=useState("正常");
  // 帳號表單
  const [uName,setUName]=useState("");const [uPass,setUPass]=useState("");const [uRole,setURole]=useState("User");
  // 補庫表單
  const [rstItemId,setRstItemId]=useState("");const [rstQty,setRstQty]=useState("");
  // 篩選
  const [fFloor,setFFloor]=useState("");const [fItem,setFItem]=useState("");
  // 修改密碼
  const [pwOld,setPwOld]=useState("");const [pwNew,setPwNew]=useState("");const [pwCfm,setPwCfm]=useState("");

  const showToast=useCallback((msg,type="info",dur=3000)=>{
    setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"info"}),dur);
  },[]);

  const { db, ref, set, onValue, push, remove } = window._fb;

  // ── Session 逾時計時器 ──
  const resetSessionTimer = useCallback(()=>{
    if(sessionTimer.current) clearTimeout(sessionTimer.current);
    sessionTimer.current = setTimeout(()=>{
      setCurrentUser(null); setScreen("login");
      showToast("⏱️ 閒置逾時，已自動登出","warn");
    }, SESSION_MINUTES * 60 * 1000);
  },[showToast]);

  useEffect(()=>{
    if(currentUser){ resetSessionTimer(); }
    return ()=>{ if(sessionTimer.current) clearTimeout(sessionTimer.current); };
  },[currentUser]);

  // ── Firebase 監聽 ──
  useEffect(()=>{
    onValue(ref(db,"items"),async(snap)=>{
      const val=snap.val();
      if(val){ setItems(Object.values(val)); }
      else {
        const obj={};
        for(const i of DEFAULT_ITEMS){
          obj[i.id]={...i, pass: await hashPass("admin123")};
        }
        // 寫入預設物料
        const itemObj={};
        DEFAULT_ITEMS.forEach(i=>{ itemObj[i.id]=i; });
        set(ref(db,"items"),itemObj);
      }
    });
    onValue(ref(db,"users"),async(snap)=>{
      const val=snap.val();
      if(val){
        setUsers(Object.values(val));
      } else {
        // 第一次：寫入雜湊過的預設帳號
        const defaults=[
          {id:"u1",name:"ray",  role:"Super"},
          {id:"u2",name:"jason",role:"Admin"},
          {id:"u3",name:"user1",role:"User"},
        ];
        const passes=["admin123","jason123","pass123"];
        const obj={};
        for(let i=0;i<defaults.length;i++){
          obj[defaults[i].id]={...defaults[i], pass: await hashPass(passes[i])};
        }
        set(ref(db,"users"),obj);
      }
      setReady(true);
    });
    onValue(ref(db,"records"),(snap)=>{
      const val=snap.val();
      if(val){
        const arr=Object.entries(val).map(([k,v])=>({...v,fbKey:k}));
        arr.sort((a,b)=>new Date(b.time)-new Date(a.time));
        setRecords(arr.slice(0,200));
      } else setRecords([]);
    });
  },[]);

  const fbSet =(path,data)=>set(ref(db,path),data);
  const fbDel =(path)=>remove(ref(db,path));
  const fbPush=(path,data)=>push(ref(db,path),data);

  // ── 登入 ──
  const doLogin=async()=>{
    // 鎖定檢查
    if(lockUntil&&new Date()<lockUntil){
      const left=Math.ceil((lockUntil-new Date())/60000);
      setLoginErr(`帳號已鎖定，請等待 ${left} 分鐘後再試`);return;
    }
    const hashed=await hashPass(loginPass);
    const user=users.find(u=>u.name.trim()===loginUser.trim()&&u.pass===hashed);
    if(!user){
      const next=loginAttempts+1;
      setLoginAttempts(next);
      if(next>=MAX_LOGIN_ATTEMPTS){
        const until=new Date(Date.now()+LOCKOUT_MINUTES*60000);
        setLockUntil(until);
        setLoginErr(`登入失敗次數過多，已鎖定 ${LOCKOUT_MINUTES} 分鐘`);
      } else {
        setLoginErr(`帳號或密碼錯誤（剩餘嘗試次數：${MAX_LOGIN_ATTEMPTS-next}）`);
      }
      return;
    }
    setLoginAttempts(0);setLockUntil(null);setLoginErr("");
    setCurrentUser({...user,floor:loginFloor,loginAt:new Date().toISOString()});
    setPage("supply");setScreen("app");
    showToast(`歡迎，${user.name}！Session 將於 ${SESSION_MINUTES} 分鐘後逾時`,"success");
  };

  const confirmLogout=()=>{
    if(sessionTimer.current)clearTimeout(sessionTimer.current);
    setCurrentUser(null);setScreen("login");setLoginUser("");setLoginPass("");
  };

  // ── 修改密碼 ──
  const changePassword=async()=>{
    if(!pwOld||!pwNew||!pwCfm){showToast("請填寫所有欄位","error");return;}
    if(pwNew!==pwCfm){showToast("新密碼與確認密碼不一致","error");return;}
    if(pwNew.length<8){showToast("新密碼至少需要 8 個字元","error");return;}
    const oldHash=await hashPass(pwOld);
    if(oldHash!==currentUser.pass){showToast("目前密碼錯誤","error");return;}
    const newHash=await hashPass(pwNew);
    // 只存乾淨的欄位回 Firebase，不含 floor/loginAt
    try {
      const cleanUser={ id:currentUser.id, name:currentUser.name, role:currentUser.role, pass:newHash };
      await fbSet(`users/${currentUser.id}`, cleanUser);
      setCurrentUser(prev=>({...prev, pass:newHash}));
      setUsers(prev=>prev.map(u=>u.id===currentUser.id?{...u,pass:newHash}:u));
      setPwOld("");setPwNew("");setPwCfm("");
      showToast("✅ 密碼已成功更新","success");
    } catch(err) {
      showToast("❌ 寫入失敗："+err.message,"error",6000);
    }
  };

  // ── 領用 ──
  const submitReq=async()=>{
    let any=false,errs=[];
    const updates={};
    items.forEach(item=>{
      const qty=parseInt(reqQtys[item.id])||0;
      if(qty<=0)return;
      if(qty>item.stock){errs.push(`${item.name} 庫存不足（現有 ${item.stock}）`);return;}
      any=true;
      updates[item.id]={...item,stock:item.stock-qty};
    });
    if(errs.length){showToast("⚠️ "+errs.join(" / "),"error",4000);return;}
    if(!any){showToast("請輸入至少一項數量","error");return;}
    for(const item of Object.values(updates)) await fbSet(`items/${item.id}`,item);
    for(const item of items){
      const qty=parseInt(reqQtys[item.id])||0;
      if(qty<=0)continue;
      await fbPush("records",{time:new Date().toLocaleString("zh-TW"),machine:reqMach,floor:reqMach.split("-")[1],item:item.name,qty,user:currentUser.name,note:reqNote});
    }
    setReqQtys({});setReqNote("正常");
    showToast("✅ 領用成功！庫存已更新","success");
    resetSessionTimer();
    const low=items.filter(i=>updates[i.id]&&updates[i.id].stock<=i.warn);
    if(low.length)setTimeout(()=>showToast(`🔔 警示：${low.map(i=>i.name).join("、")} 庫存偏低！`,"warn",5000),2000);
  };

  // ── 物料管理 ──
  const addItem=async()=>{
    if(!iName||!iUnit){showToast("請填寫名稱與單位","error");return;}
    const id="i"+Date.now();
    await fbSet(`items/${id}`,{id,name:iName,unit:iUnit,price:parseFloat(iPrice)||0,stock:parseInt(iStock)||0,warn:parseInt(iWarn)||20});
    setIName("");setIUnit("");setIPrice("");setIWarn("");setIStock("");
    showToast("✅ 物料已新增","success");
  };
  const editItem=(it)=>{
    setIName(it.name);setIUnit(it.unit);setIPrice(String(it.price));setIWarn(String(it.warn));setIStock(String(it.stock));
    setModal({title:`編輯：${it.name}`,body:"確認以目前欄位內容更新此物料？",onOk:async()=>{
      await fbSet(`items/${it.id}`,{...it,name:iName||it.name,unit:iUnit||it.unit,price:parseFloat(iPrice)||it.price,warn:parseInt(iWarn)||it.warn,stock:parseInt(iStock)||it.stock});
      setIName("");setIUnit("");setIPrice("");setIWarn("");setIStock("");
      showToast("✅ 物料已更新","success");
    }});
  };
  const delItem=(it)=>setModal({title:"刪除物料",body:`確定刪除「${it.name}」？此操作無法復原。`,okColor:"red",okLabel:"確定刪除",onOk:async()=>{await fbDel(`items/${it.id}`);showToast("🗑️ 已刪除");}});
  const quickRst=(it)=>{
    let q=0;
    setModal({title:`快速補庫：${it.name}`,body:<div><div style={{marginBottom:10}}>現有：<strong style={{color:C.gold}}>{it.stock} {it.unit}</strong></div><input type="number" defaultValue="" onChange={e=>q=parseInt(e.target.value)||0} placeholder="50" style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(196,122,43,.25)",borderRadius:9,padding:"10px 14px",color:C.cream,...mono,outline:"none"}}/></div>,
      onOk:async()=>{if(q<=0){showToast("請輸入有效數量","error");return;}await fbSet(`items/${it.id}`,{...it,stock:it.stock+q});showToast(`✅ 補庫 ${q} ${it.unit} 成功`,"success");}});
  };
  const doRestock=async()=>{
    const q=parseInt(rstQty)||0,it=items.find(i=>i.id===rstItemId);
    if(!it||q<=0){showToast("請選擇物料並輸入數量","error");return;}
    await fbSet(`items/${it.id}`,{...it,stock:it.stock+q});setRstQty("");

  // ── 帳號管理 ──
  const isAdmin=currentUser?.role==="Super"||currentUser?.role==="Admin";
  const canManageUser=(u)=>{
    if(currentUser?.role==="Super") return u.role!=="Super"||u.id===currentUser.id;
    if(currentUser?.role==="Admin") return u.role==="User";
    return false;
  };
  const addUser=async()=>{
    if(!isAdmin){showToast("權限不足","error");return;}
    const tn=uName.trim(),tp=uPass.trim();
    if(!tn||!tp){showToast("請填寫帳號與密碼","error");return;}
    if(tp.length<8){showToast("密碼至少需要 8 個字元","error");return;}
    if(users.find(u=>u.name===tn)){showToast("帳號已存在","error");return;}
    if(currentUser?.role==="Admin"&&uRole!=="User"){showToast("Admin 只能新增 User 帳號","error");return;}
    const id="u"+Date.now();
    const hashed=await hashPass(tp);
    await fbSet(`users/${id}`,{id,name:tn,pass:hashed,role:uRole});
    setUName("");setUPass("");showToast("✅ 帳號已建立","success");
  };
  const delUser=(u)=>{
    if(!canManageUser(u)){showToast("權限不足，無法刪除此帳號","error");return;}

  };
  // Admin 重設他人密碼
  const resetUserPass=(u)=>{

    setModal({title:`重設密碼：${u.name}`,body:<div>
      <div style={{marginBottom:10,fontSize:".8rem",color:C.muted,...mono}}>請輸入新密碼（至少 8 字元）</div>

    </div>,onOk:async()=>{
      if(newP.length<8){showToast("密碼至少需要 8 個字元","error");return;}
      const hashed=await hashPass(newP);
      await fbSet(`users/${u.id}`,{...u,pass:hashed});
      showToast(`✅ ${u.name} 的密碼已重設`,"success");

  };

  // ── 匯出備份 ──
  const exportBackup=()=>{
    const data={ exportedAt: new Date().toISOString(), exportedBy: currentUser.name, items, users: users.map(u=>({...u,pass:"******"})), records };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=`coffee_erp_backup_${new Date().toLocaleDateString("zh-TW").replace(/\//g,"-")}.json`;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    showToast("📥 備份檔已下載","success");
  };

  const monthlyCost=()=>{const n=new Date();return records.filter(r=>{const d=new Date(r.time);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).reduce((a,r)=>{const i=items.find(x=>x.name===r.item);return a+(i?i.price*r.qty:0);},0).toFixed(0);};

          🔒 帳號已鎖定，請 {LOCKOUT_MINUTES} 分鐘後再試

            {[{icon:"📦",label:"低庫存警示",val:lowCount,unit:"項需補貨",accent:lowCount>0?"#e74c3c":C.safe},{icon:"✅",label:"庫存正常",val:items.length-lowCount,unit:"項充足",accent:C.safe},{icon:"📋",label:"今日領用",val:todayRecs.length,unit:"筆紀錄",accent:C.cream},{icon:"💰",label:"本月成本",val:monthlyCost(),unit:"元",accent:C.cream}].map(s=>(
              <div key={s.label} style={{background:"linear-gradient(145deg,rgba(59,31,14,.8),rgba(26,15,7,.6))",border:"1px solid rgba(196,122,43,.2)",borderRadius:14,padding:"18px 18px 14px",position:"relative"}}>
                <div style={{position:"absolute",right:14,top:12,fontSize:"1.4rem",opacity:.3}}>{s.icon}</div>
                <div style={{fontSize:".68rem",color:C.muted,...mono}}>{s.label}</div>
                <div style={{...serif,fontSize:"1.9rem",fontWeight:700,color:s.accent,margin:"4px 0 2px"}}>{s.val}</div>
                <div style={{fontSize:".68rem",color:C.muted}}>{s.unit}</div>
              </div>

          </div>
          <Card title="📦 現有庫存" hint="Firebase 即時同步">
            <table style={{width:"100%",borderCollapse:"collapse"}}>

              <tbody>{items.map(item=>{const pct=Math.min(100,Math.round(item.stock/(item.warn*5)*100));return(

              {[["fFloor",fFloor,setFFloor,["","B1F","1F","2F","3F"],["全部樓層","B1F","1F","2F","3F"]],["fItem",fItem,setFItem,["",...items.map(i=>i.name)],["全部物料",...items.map(i=>i.name)]]].map(([key,val,set,vals,labels])=>(
                <select key={key} value={val} onChange={e=>set(e.target.value)} style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(196,122,43,.2)",borderRadius:8,padding:"8px 13px",color:C.cream,...mono,fontSize:".8rem",outline:"none"}}>

            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr>{["時間","機台","物料","數量","操作者","備註"].map(h=><th key={h} style={{padding:"10px 18px",textAlign:"left",fontSize:".68rem",color:C.muted,borderBottom:"1px solid rgba(196,122,43,.1)",...mono}}>{h}</th>)}</tr></thead>

        {/* ── 後台管理 ── */}
        {page==="admin"&&<>

            <div>
              <Card title="👤 帳號管理" hint={currentUser?.role==="Admin"?"可管理 User":"Super 可管理所有帳號"}>
                <div style={{padding:"18px 22px",display:"flex",flexDirection:"column",gap:12}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11}}>
                    <div><div style={{fontSize:".7rem",color:C.muted,...mono,marginBottom:5}}>帳號</div><QInput value={uName} onChange={setUName} placeholder="帳號"/></div>
                    <div>
                      <div style={{fontSize:".7rem",color:C.muted,...mono,marginBottom:5}}>密碼</div>
                      <QInput type="password" value={uPass} onChange={setUPass} placeholder="至少 8 字元"/>
                      <PasswordStrength pass={uPass}/>
                    </div>
                  </div>
                  <div><div style={{fontSize:".7rem",color:C.muted,...mono,marginBottom:5}}>權限等級</div>
                    <select value={uRole} onChange={e=>setURole(e.target.value)} style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(196,122,43,.22)",borderRadius:9,padding:"10px 14px",color:C.cream,...mono,fontSize:".88rem",outline:"none"}}>
                      <option value="User" style={{background:C.roast}}>User（現場人員）</option>
                      {currentUser?.role==="Super"&&<option value="Admin" style={{background:C.roast}}>Admin（管理者）</option>}
                      {currentUser?.role==="Super"&&<option value="Super" style={{background:C.roast}}>Super（最高）</option>}
                    </select>
                  </div>
                  <Btn onClick={addUser} style={{padding:"10px"}}>+ 新增帳號</Btn>
                </div>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead><tr>{["帳號","權限","操作"].map(h=><th key={h} style={{padding:"9px 16px",textAlign:"left",fontSize:".66rem",color:C.muted,borderBottom:"1px solid rgba(196,122,43,.1)",...mono}}>{h}</th>)}</tr></thead>
                  <tbody>{users.map(u=>(
                    <tr key={u.id} style={{borderBottom:"1px solid rgba(255,255,255,.04)"}}>
                      <td style={{padding:"12px 16px",...mono}}>{u.name}{u.id===currentUser?.id&&<span style={{fontSize:".65rem",color:C.muted,marginLeft:6}}>(我)</span>}</td>
                      <td style={{padding:"12px 16px"}}><Tag label={u.role} type={u.role==="Super"?"danger":u.role==="Admin"?"warn":"safe"}/></td>
                      <td style={{padding:"12px 16px"}}><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                        {canManageUser(u)&&<SmBtn onClick={()=>resetUserPass(u)} color="blue">重設密碼</SmBtn>}
                        {canManageUser(u)&&u.id!==currentUser?.id&&<SmBtn onClick={()=>delUser(u)} color="del">刪除</SmBtn>}
                        {!canManageUser(u)&&<span style={{fontSize:".72rem",color:C.muted}}>—</span>}
                      </div></td>
                    </tr>
                  ))}</tbody>
                </table>
              </Card>
              <Card title="🚚 進貨補庫" style={{marginBottom:0}}>
                <div style={{padding:"18px 22px",display:"flex",flexDirection:"column",gap:12}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11}}>
                    <div><div style={{fontSize:".7rem",color:C.muted,...mono,marginBottom:5}}>物料</div>
                      <select value={rstItemId} onChange={e=>setRstItemId(e.target.value)} style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(196,122,43,.22)",borderRadius:9,padding:"10px 14px",color:C.cream,...mono,fontSize:".88rem",outline:"none"}}>
                        <option value="" style={{background:C.roast}}>選擇物料</option>
                        {items.map(i=><option key={i.id} value={i.id} style={{background:C.roast}}>{i.name}</option>)}
                      </select>
                    </div>
                    <div><div style={{fontSize:".7rem",color:C.muted,...mono,marginBottom:5}}>進貨數量</div><QInput type="number" value={rstQty} onChange={setRstQty} placeholder="50"/></div>
                  </div>
                  <Btn onClick={doRestock} color="green" style={{padding:"10px"}}>+ 確認進貨</Btn>
                </div>
              </Card>
            </div>
          </div>
        </>}

        {/* ── 成本分析 ── */}
        {page==="analytics"&&<>
          <div style={{...serif,fontSize:"1.85rem",color:C.gold,marginBottom:5}}>成本分析</div>
          <div style={{color:C.muted,fontSize:".8rem",marginBottom:28,...mono}}>COST ANALYTICS</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:18,marginBottom:24}}>
            {["B1F","1F","2F","3F"].map(fl=>{
              const recs=records.filter(r=>r.floor===fl);
              const total=recs.reduce((a,r)=>{const i=items.find(x=>x.name===r.item);return a+(i?i.price*r.qty:0);},0);
              return <div key={fl} style={{background:"linear-gradient(145deg,rgba(59,31,14,.7),rgba(26,15,7,.5))",border:"1px solid rgba(196,122,43,.2)",borderRadius:16,padding:22}}>
                <div style={{...serif,fontSize:"1.25rem",color:C.gold,marginBottom:14}}>{fl}</div>
                {items.map(item=>{const qty=recs.filter(r=>r.item===item.name).reduce((a,r)=>a+r.qty,0);return <div key={item.id} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.05)",fontSize:".82rem"}}><span style={{color:C.muted,...mono,fontSize:".74rem"}}>{item.name}</span><span style={{...mono}}>${(qty*item.price).toFixed(0)}</span></div>;})}
                <hr style={{border:"none",borderTop:"1px solid rgba(196,122,43,.12)",margin:"7px 0"}}/>
                <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,color:C.gold,...mono}}><span>本月合計</span><span>${total.toFixed(0)}</span></div>
              </div>;
            })}
          </div>
          <Card title="📈 物料消耗排行">
            {(()=>{
              const costs=items.map(item=>{const tq=records.filter(r=>r.item===item.name).reduce((a,r)=>a+r.qty,0);return{...item,tq,tc:tq*item.price};}).sort((a,b)=>b.tc-a.tc);
              const gt=costs.reduce((a,i)=>a+i.tc,0)||1;
              return <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr>{["物料","總領用","單位","總成本","佔比"].map(h=><th key={h} style={{padding:"10px 18px",textAlign:"left",fontSize:".68rem",color:C.muted,borderBottom:"1px solid rgba(196,122,43,.1)",...mono}}>{h}</th>)}</tr></thead>
                <tbody>{costs.map(it=>{const pct=((it.tc/gt)*100).toFixed(1);return(
                  <tr key={it.id} style={{borderBottom:"1px solid rgba(255,255,255,.04)"}}>
                    <td style={{padding:"12px 18px"}}>{it.name}</td>
                    <td style={{padding:"12px 18px",...mono,color:C.gold}}>{it.tq.toLocaleString()}</td>
                    <td style={{padding:"12px 18px",color:C.muted}}>{it.unit}</td>
                    <td style={{padding:"12px 18px",...mono,color:C.caramel}}>${it.tc.toFixed(0)}</td>
                    <td style={{padding:"12px 18px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{...mono,fontSize:".74rem",color:C.muted,width:36}}>{pct}%</span><div style={{flex:1,height:5,background:"rgba(255,255,255,.08)",borderRadius:3,overflow:"hidden",minWidth:80}}><div style={{width:`${pct}%`,height:"100%",background:`linear-gradient(90deg,${C.warn},#f39c12)`,borderRadius:3}}/></div></div></td>
                  </tr>
                );})}</tbody>
              </table>;
            })()}
          </Card>
        </>}

        {/* ── 我的帳號 ── */}
        {page==="profile"&&<>
          <div style={{...serif,fontSize:"1.85rem",color:C.gold,marginBottom:5}}>我的帳號</div>
          <div style={{color:C.muted,fontSize:".8rem",marginBottom:28,...mono}}>PROFILE · 個人資料與密碼管理</div>
          {/* 備份區塊 */}
          <Card title="💾 資料備份" hint="建議每月備份一次">
            <div style={{padding:"22px",display:"flex",flexDirection:"column",gap:14}}>
              <div style={{background:"rgba(255,255,255,.04)",borderRadius:10,padding:"14px 16px",fontSize:".82rem",color:C.muted,lineHeight:1.8,...mono}}>
                <div>📦 物料項目：<strong style={{color:C.cream}}>{items.length} 項</strong></div>
                <div>📋 領用紀錄：<strong style={{color:C.cream}}>{records.length} 筆</strong></div>
                <div>👤 帳號數量：<strong style={{color:C.cream}}>{users.length} 個</strong></div>
                <div style={{marginTop:8,fontSize:".72rem",color:C.muted}}>⚠️ 備份檔中密碼欄位已遮蔽，不含明文資訊</div>
              </div>
              <Btn onClick={exportBackup} color="green" style={{padding:"12px"}}>
                📥 立即下載備份檔（JSON）
              </Btn>
              <div style={{fontSize:".72rem",color:C.muted,...mono,lineHeight:1.7,background:"rgba(255,255,255,.03)",borderRadius:8,padding:"10px 12px"}}>
                備份檔包含：所有物料庫存、領用紀錄、帳號清單（密碼已隱藏）。<br/>
                如需還原請聯絡 Ray（Super Admin）重新匯入。
              </div>
            </div>
          </Card>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:22}}>
            <Card title="📋 帳號資訊">              <div style={{padding:"22px"}}>
                {[["帳號名稱",currentUser?.name],["權限等級",currentUser?.role],["登入樓層",currentUser?.floor],["登入時間",currentUser?.loginAt?new Date(currentUser.loginAt).toLocaleString("zh-TW"):"—"],["Session 逾時",`${SESSION_MINUTES} 分鐘閒置`]].map(([l,v])=>(
                  <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
                    <span style={{fontSize:".8rem",color:C.muted,...mono}}>{l}</span>
                    <span style={{fontSize:".88rem",color:C.cream,...mono}}>{v}</span>
                  </div>
                ))}
              </div>
            </Card>
            <Card title="🔑 修改密碼">
              <div style={{padding:"22px",display:"flex",flexDirection:"column",gap:14}}>
                <div>
                  <div style={{fontSize:".7rem",color:C.muted,...mono,marginBottom:5}}>目前密碼</div>
                  <QInput type="password" value={pwOld} onChange={setPwOld} placeholder="輸入目前密碼"/>
                </div>
                <div>
                  <div style={{fontSize:".7rem",color:C.muted,...mono,marginBottom:5}}>新密碼</div>
                  <QInput type="password" value={pwNew} onChange={setPwNew} placeholder="至少 8 字元"/>
                  <PasswordStrength pass={pwNew}/>
                </div>
                <div>
                  <div style={{fontSize:".7rem",color:C.muted,...mono,marginBottom:5}}>確認新密碼</div>
                  <QInput type="password" value={pwCfm} onChange={setPwCfm} placeholder="再次輸入新密碼"/>
                  {pwCfm&&pwNew!==pwCfm&&<div style={{fontSize:".7rem",color:"#e74c3c",...mono,marginTop:4}}>⚠️ 兩次密碼不一致</div>}
                  {pwCfm&&pwNew===pwCfm&&pwCfm.length>0&&<div style={{fontSize:".7rem",color:"#2ecc71",...mono,marginTop:4}}>✓ 密碼一致</div>}
                </div>
                <Btn onClick={changePassword} color="green" style={{padding:"11px"}}>🔑 確認修改密碼</Btn>
                <div style={{fontSize:".72rem",color:C.muted,...mono,lineHeight:1.7,background:"rgba(255,255,255,.04)",borderRadius:8,padding:"10px 12px"}}>
                  密碼要求：至少 8 字元，建議包含大寫字母、數字及符號以提升安全性。
                </div>
              </div>
            </Card>
          </div>
        </>}
      </div>

      {modal&&<Modal title={modal.title} body={modal.body} okColor={modal.okColor} okLabel={modal.okLabel} onOk={()=>{modal.onOk();setModal(null);}} onClose={()=>setModal(null)}/>}
      <Toast msg={toast.msg} type={toast.type}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
