<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body,#root{min-height:100vh;font-family:'Noto Serif TC',serif;background:#1a0f07;color:#f5ead8}
input,select{font-family:'Noto Serif TC',serif;box-sizing:border-box}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(196,122,43,.4);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .desknav{display:none!important}
  .mobnav{display:flex!important}
  .g2{grid-template-columns:1fr!important}

  .pad{padding:14px 10px 80px!important}

<body>
<div id="root"></div>
<script>
// ── 常數 ──
const MAX_ATT=5, LOCK_MIN=15, SESS_MIN=120, SALT="WIS387";
const db = window._db;
const {createElement:h, useState, useEffect, useCallback, useRef, Fragment} = React;

// ── 顏色 ──
const C = {
  bg:"#1a0f07", roast:"#3b1f0e", gold:"#e8a94a", cream:"#f5ead8",
  muted:"#8a7260", caramel:"#c47a2b", safe:"#27ae60", warn:"#e67e22", danger:"#c0392b"
};
const M = {fontFamily:"'DM Mono',monospace"};
const S = {fontFamily:"'Playfair Display',serif"};

// ── 工具 ──
async function hashPass(p){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT+p));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const DEF_ITEMS=[
  {id:"i1",name:"咖啡豆",unit:"包",price:280,stock:100,warn:20},
  {id:"i2",name:"牛奶球",unit:"顆",price:3,stock:5000,warn:500},
  {id:"i3",name:"糖包",unit:"包",price:1,stock:800,warn:100},
  {id:"i4",name:"攪拌棒",unit:"支",price:2,stock:300,warn:50},
  {id:"i5",name:"紙杯",unit:"個",price:1.5,stock:600,warn:100},
];
const DEF_MACH = ["W1","W2","W3","W4","W5"];

// ── 小元件（用 h() 代替 JSX）──
function el(tag, props, ...children){ return h(tag, props, ...children); }

function Tag({label, type}){
  const t = {
    safe:{bg:"rgba(39,174,96,.15)",c:"#2ecc71",b:"rgba(39,174,96,.3)"},
    warn:{bg:"rgba(230,126,34,.15)",c:"#e67e22",b:"rgba(230,126,34,.3)"},
    danger:{bg:"rgba(192,57,43,.15)",c:"#e74c3c",b:"rgba(192,57,43,.3)"}
  }[type] || {bg:"rgba(255,255,255,.08)",c:"#f5ead8",b:"rgba(255,255,255,.15)"};
  return el("span",{style:{display:"inline-block",padding:"3px 10px",borderRadius:20,fontSize:".67rem",...M,background:t.bg,color:t.c,border:`1px solid ${t.b}`}},label);
}

function Bar({pct}){
  const g = pct>40?`linear-gradient(90deg,${C.safe},#2ecc71)`:pct>20?`linear-gradient(90deg,${C.warn},#f39c12)`:`linear-gradient(90deg,${C.danger},#e74c3c)`;
  return el("div",{style:{flex:1,height:5,background:"rgba(255,255,255,.08)",borderRadius:3,overflow:"hidden",minWidth:50}},
    el("div",{style:{width:`${pct}%`,height:"100%",background:g,borderRadius:3,transition:"width .5s"}}));
}

function Card({title,hint,children,style}){
  return el("div",{style:{background:"linear-gradient(145deg,rgba(59,31,14,.65),rgba(26,15,7,.5))",border:"1px solid rgba(196,122,43,.18)",borderRadius:14,overflow:"hidden",marginBottom:20,...style}},
    (title||hint) && el("div",{style:{padding:"14px 18px 12px",borderBottom:"1px solid rgba(196,122,43,.1)",display:"flex",alignItems:"center",justifyContent:"space-between"}},
      el("span",{style:{fontSize:".9rem",fontWeight:600,color:C.cream}},title),
      el("span",{style:{fontSize:".68rem",color:C.muted,...M}},hint)
    ),
    children
  );
}

function PwInp({value,onChange,placeholder,disabled}){
  const [show,setShow] = useState(false);
  return el("div",{style:{position:"relative"}},
    el("input",{type:show?"text":"password",value,onChange:e=>onChange(e.target.value),placeholder,disabled,
      style:{width:"100%",background:disabled?"rgba(255,255,255,.03)":"rgba(255,255,255,.07)",border:"1px solid rgba(196,122,43,.22)",borderRadius:9,padding:"10px 38px 10px 12px",color:C.cream,fontSize:".88rem",outline:"none",...M}}),
    el("button",{type:"button",onClick:()=>setShow(s=>!s),style:{position:"absolute",right:9,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.muted,fontSize:".95rem"}},show?"🙈":"👁️")
  );
}

function numInp(value,onChange,placeholder){
  return el("input",{type:"number",value,onChange:e=>onChange(e.target.value),placeholder,
    style:{width:"100%",background:"rgba(255,255,255,.07)",border:"1px solid rgba(196,122,43,.22)",borderRadius:8,padding:"9px 12px",color:C.cream,fontSize:".9rem",outline:"none",...M}});
}
function txtInp(value,onChange,placeholder){
  return el("input",{type:"text",value,onChange:e=>onChange(e.target.value),placeholder,
    style:{width:"100%",background:"rgba(255,255,255,.07)",border:"1px solid rgba(196,122,43,.22)",borderRadius:8,padding:"9px 12px",color:C.cream,fontSize:".9rem",outline:"none",...M}});
}

function Btn({onClick,children,color,style,disabled}){
  const bg={gold:`linear-gradient(135deg,${C.caramel},${C.gold})`,green:"linear-gradient(135deg,#27ae60,#2ecc71)",red:`linear-gradient(135deg,${C.danger},#e74c3c)`}[color||"gold"];
  return el("button",{onClick,disabled,style:{padding:"9px 18px",background:disabled?"rgba(255,255,255,.05)":bg,border:"none",borderRadius:8,color:color==="gold"?C.bg:"#fff",fontWeight:700,fontSize:".84rem",cursor:disabled?"not-allowed":"pointer",fontFamily:"'Noto Serif TC',serif",...style}},children);
}

function SBtn({onClick,children,c}){
  const m={edit:{bg:"rgba(196,122,43,.1)",b:"rgba(196,122,43,.4)",c:C.gold},green:{bg:"rgba(39,174,96,.1)",b:"rgba(39,174,96,.4)",c:"#2ecc71"},red:{bg:"rgba(192,57,43,.1)",b:"rgba(192,57,43,.4)",c:"#e74c3c"},blue:{bg:"rgba(52,152,219,.1)",b:"rgba(52,152,219,.4)",c:"#3498db"}}[c||"edit"];
  return el("button",{onClick,style:{padding:"4px 10px",background:m.bg,border:`1px solid ${m.b}`,borderRadius:6,color:m.c,fontSize:".7rem",cursor:"pointer",...M}},children);
}

function Toast({msg,type}){
  const bg = type==="error"?"rgba(192,57,43,.95)":type==="success"?"rgba(39,130,60,.95)":C.roast;
  return el("div",{style:{position:"fixed",bottom:72,right:16,zIndex:300,background:bg,border:`1px solid ${C.caramel}`,borderRadius:12,padding:"12px 18px",color:C.cream,fontSize:".85rem",maxWidth:300,opacity:msg?1:0,transform:msg?"translateY(0)":"translateY(12px)",transition:"all .3s",pointerEvents:"none",...M}},msg);
}

function Modal({title,body,onOk,onClose,okLabel,okRed}){
  if(!title) return null;
  return el("div",{onClick:e=>{if(e.target===e.currentTarget)onClose();},style:{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,.75)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
    el("div",{style:{background:`linear-gradient(145deg,${C.roast},#1e0e06)`,border:"1px solid rgba(196,122,43,.35)",borderRadius:14,padding:24,width:"min(460px,100%)",boxShadow:"0 20px 60px rgba(0,0,0,.7)"}},
      el("div",{style:{...S,fontSize:"1.1rem",color:C.gold,marginBottom:12}},title),
      el("div",{style:{color:C.muted,fontSize:".85rem",lineHeight:1.7,marginBottom:16}},body),
      el("div",{style:{display:"flex",gap:10,justifyContent:"flex-end"}},
        el("button",{onClick:onClose,style:{padding:"8px 16px",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:7,color:C.muted,cursor:"pointer",...M,fontSize:".78rem"}},"取消"),
        el("button",{onClick:onOk,style:{padding:"8px 16px",background:okRed?`linear-gradient(135deg,${C.danger},#e74c3c)`:`linear-gradient(135deg,${C.caramel},${C.gold})`,border:"none",borderRadius:7,color:okRed?"#fff":C.bg,fontWeight:700,cursor:"pointer",...M,fontSize:".78rem"}},okLabel||"確認")
      )
    )
  );
}

function PwStr({pass}){
  if(!pass) return null;
  const chk=[pass.length>=8,/[A-Z]/.test(pass),/[0-9]/.test(pass),/[^A-Za-z0-9]/.test(pass)];
  const sc=chk.filter(Boolean).length;
  const col=["#e74c3c","#e74c3c","#e67e22","#f1c40f","#2ecc71"][sc];
  return el("div",{style:{marginTop:5}},
    el("div",{style:{display:"flex",gap:3,marginBottom:3}},
      chk.map((_,i)=>el("div",{key:i,style:{flex:1,height:3,borderRadius:2,background:i<sc?col:"rgba(255,255,255,.1)"}}))
    ),
    el("div",{style:{fontSize:".66rem",...M,color:col}},
      ["太短","弱","普通","強","非常強"][sc]+"："+[pass.length<8?"需8字":"✓8字",!/[A-Z]/.test(pass)?"需大寫":"✓大寫",!/[0-9]/.test(pass)?"需數字":"✓數字",!/[^A-Za-z0-9]/.test(pass)?"建議符號":"✓符號"].join("·")
    )
  );
}

// ══ 主 APP ══
function App(){
  const [ready,setReady]=useState(false);
  const [screen,setScreen]=useState("login");
  const [page,setPage]=useState("supply");
  const [me,setMe]=useState(null);
  const [items,setItems]=useState([]);
  const [users,setUsers]=useState([]);
  const [records,setRecords]=useState([]);
  const [machines,setMachines]=useState([]);
  const [toast,setToast]=useState({msg:"",type:"info"});
  const [modal,setModal]=useState(null);
  const timer=useRef(null);

  // 表單 state
  const [lu,setLu]=useState(""); const [lp,setLp]=useState(""); const [lf,setLf]=useState("B1F");
  const [le,setLe]=useState(""); const [att,setAtt]=useState(0); const [lock,setLock]=useState(null);
  const [rq,setRq]=useState({}); const [rm,setRm]=useState(""); const [rn,setRn]=useState("正常");
  const [iN,setIN]=useState(""); const [iU,setIU]=useState(""); const [iP,setIP]=useState("");
  const [iW,setIW]=useState(""); const [iS,setIS]=useState("");
  const [uN,setUN]=useState(""); const [uP,setUP]=useState(""); const [uR,setUR]=useState("User");
  const [rId,setRId]=useState(""); const [rQty,setRQty]=useState("");
  const [ff,setFf]=useState(""); const [fi,setFi]=useState("");
  const [po,setPo]=useState(""); const [pn,setPn]=useState(""); const [pc,setPc]=useState("");
  const [editMIdx,setEditMIdx]=useState(null); const [editMName,setEditMName]=useState(""); const [newMName,setNewMName]=useState("");

  const t2=useCallback((msg,type="info",dur=3000)=>{
    setToast({msg,type}); setTimeout(()=>setToast({msg:"",type:"info"}),dur);
  },[]);

  const resetTimer=useCallback(()=>{
    if(timer.current)clearTimeout(timer.current);
    timer.current=setTimeout(()=>{setMe(null);setScreen("login");t2("⏱️ 閒置逾時已登出","warn");},SESS_MIN*60*1000);
  },[t2]);

  useEffect(()=>{if(me)resetTimer();return()=>{if(timer.current)clearTimeout(timer.current);};},[me]);

  // Firebase 監聽
  useEffect(()=>{
    db.ref("machines").on("value",snap=>{
      const v=snap.val();
      if(v){ setMachines(Object.entries(v).map(([k,m])=>({...m,fbKey:k})).sort((a,b)=>(a.idx||0)-(b.idx||0))); }
      else{ const o={}; DEF_MACH.forEach((name,i)=>{o[`m${i+1}`]={id:`m${i+1}`,idx:i,name};}); db.ref("machines").set(o); }
    });
    db.ref("items").on("value",snap=>{
      const v=snap.val();
      if(v) setItems(Object.values(v));
      else{ const o={}; DEF_ITEMS.forEach(i=>{o[i.id]=i;}); db.ref("items").set(o); }
    });
    db.ref("users").on("value",async snap=>{
      const v=snap.val();
      if(v){ setUsers(Object.values(v)); }
      else{
        const defs=[{id:"u1",name:"ray",role:"Super"},{id:"u2",name:"jason",role:"Admin"},{id:"u3",name:"user1",role:"User"}];
        const pw=["admin123","jason123","pass123"];
        const o={};
        for(let i=0;i<defs.length;i++) o[defs[i].id]={...defs[i],pass:await hashPass(pw[i])};
        db.ref("users").set(o);
      }
      setReady(true);
    });
    db.ref("records").on("value",snap=>{
      const v=snap.val();
      if(v){ const arr=Object.entries(v).map(([k,r])=>({...r,fbKey:k})).sort((a,b)=>new Date(b.time)-new Date(a.time)); setRecords(arr.slice(0,200)); }
      else setRecords([]);
    });
  },[]);

  const fbs=(path,data)=>db.ref(path).set(data);
  const fbd=(path)=>db.ref(path).remove();
  const fbp=(path,data)=>db.ref(path).push(data);

  const isAdmin=me?.role==="Super"||me?.role==="Admin";
  const canMgr=(u)=>{ if(me?.role==="Super") return u.role!=="Super"||u.id===me.id; if(me?.role==="Admin") return u.role==="User"; return false; };
  const isLocked=lock&&new Date()<lock;
  const machNames=machines.map(m=>m.name);

  // 登入
  const doLogin=async()=>{
    if(isLocked){const l=Math.ceil((lock-new Date())/60000);setLe(`已鎖定，請等 ${l} 分鐘`);return;}
    const hash=await hashPass(lp);
    const u=users.find(x=>x.name.trim()===lu.trim()&&x.pass===hash);
    if(!u){
      const n=att+1; setAtt(n);
      if(n>=MAX_ATT){setLock(new Date(Date.now()+LOCK_MIN*60000));setLe(`失敗過多，鎖定 ${LOCK_MIN} 分鐘`);}
      else setLe(`帳號或密碼錯誤（剩 ${MAX_ATT-n} 次）`);
      return;
    }
    setAtt(0);setLock(null);setLe("");
    setMe({...u,floor:lf,loginAt:new Date().toISOString()});
    setPage("supply");setScreen("app");t2(`歡迎，${u.name}！`,"success");
  };
  const doLogout=()=>{if(timer.current)clearTimeout(timer.current);setMe(null);setScreen("login");setLu("");setLp("");};

  const changePw=async()=>{
    if(!po||!pn||!pc){t2("請填寫所有欄位","error");return;}
    if(pn!==pc){t2("新密碼不一致","error");return;}
    if(pn.length<8){t2("密碼至少 8 字元","error");return;}
    if(await hashPass(po)!==me.pass){t2("目前密碼錯誤","error");return;}
    try{
      const nh=await hashPass(pn);
      await fbs(`users/${me.id}`,{id:me.id,name:me.name,role:me.role,pass:nh});
      setMe(prev=>({...prev,pass:nh})); setUsers(prev=>prev.map(u=>u.id===me.id?{...u,pass:nh}:u));
      setPo("");setPn("");setPc("");t2("✅ 密碼已更新","success");
    }catch(e){t2("❌ 更新失敗："+e.message,"error",5000);}
  };

  const backup=()=>{
    const d={exportedAt:new Date().toISOString(),by:me.name,items,users:users.map(u=>({...u,pass:"******"})),records};
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));
    a.download=`coffee_erp_${new Date().toLocaleDateString("zh-TW").replace(/\//g,"-")}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    t2("📥 備份檔已下載","success");
  };

  const doReq=async()=>{
    let any=false,errs=[],upd={};
    items.forEach(item=>{const q=parseInt(rq[item.id])||0;if(q<=0)return;if(q>item.stock){errs.push(`${item.name}庫存不足`);return;}any=true;upd[item.id]={...item,stock:item.stock-q};});
    if(errs.length){t2("⚠️ "+errs.join("、"),"error",4000);return;}
    if(!any){t2("請輸入至少一項數量","error");return;}
    const mach=rm||machNames[0]||"";
    for(const item of Object.values(upd)) await fbs(`items/${item.id}`,item);
    for(const item of items){const q=parseInt(rq[item.id])||0;if(q<=0)continue;await fbp("records",{time:new Date().toLocaleString("zh-TW"),machine:mach,floor:mach,item:item.name,qty:q,user:me.name,note:rn});}
    setRq({});setRn("正常");t2("✅ 領用成功","success");resetTimer();
    const low=items.filter(i=>upd[i.id]&&upd[i.id].stock<=i.warn);
    if(low.length)setTimeout(()=>t2(`🔔 ${low.map(i=>i.name).join("、")} 庫存偏低！`,"warn",5000),2000);
  };

  const addItem=async()=>{
    if(!iN||!iU){t2("請填寫名稱與單位","error");return;}
    const id="i"+Date.now();
    await fbs(`items/${id}`,{id,name:iN,unit:iU,price:parseFloat(iP)||0,stock:parseInt(iS)||0,warn:parseInt(iW)||20});
    setIN("");setIU("");setIP("");setIW("");setIS("");t2("✅ 物料已新增","success");
  };
  const editItem=(it)=>{
    setIN(it.name);setIU(it.unit);setIP(String(it.price));setIW(String(it.warn));setIS(String(it.stock));
    setModal({title:`編輯：${it.name}`,body:"確認更新？",onOk:async()=>{
      await fbs(`items/${it.id}`,{...it,name:iN||it.name,unit:iU||it.unit,price:parseFloat(iP)||it.price,warn:parseInt(iW)||it.warn,stock:parseInt(iS)||it.stock});
      setIN("");setIU("");setIP("");setIW("");setIS("");t2("✅ 已更新","success");
    }});
  };
  const delItem=(it)=>setModal({title:"刪除物料",body:`確定刪除「${it.name}」？`,okRed:true,okLabel:"確定刪除",onOk:async()=>{await fbd(`items/${it.id}`);t2("🗑️ 已刪除");}});
  const rstItem=(it)=>{
    let q=0;
    setModal({title:`補庫：${it.name}`,
      body:el("div",null,
        el("div",{style:{marginBottom:8,color:C.muted,...M,fontSize:".8rem"}},"現有：",el("strong",{style:{color:C.gold}},`${it.stock} ${it.unit}`)),
        el("input",{type:"number",onChange:e=>{q=parseInt(e.target.value)||0;},placeholder:"補庫數量",style:{width:"100%",background:"rgba(255,255,255,.07)",border:"1px solid rgba(196,122,43,.3)",borderRadius:8,padding:"9px 12px",color:C.cream,...M,outline:"none",fontSize:".9rem"}})
      ),
      onOk:async()=>{if(q<=0){t2("請輸入有效數量","error");return;}await fbs(`items/${it.id}`,{...it,stock:it.stock+q});t2(`✅ 補庫 ${q} ${it.unit} 成功`,"success");}
    });
  };
  const doRestock=async()=>{
    const q=parseInt(rQty)||0, it=items.find(i=>i.id===rId);
    if(!it||q<=0){t2("請選擇物料並輸入數量","error");return;}
    await fbs(`items/${it.id}`,{...it,stock:it.stock+q});setRQty("");t2(`✅ ${it.name} 補庫完成`,"success");
  };

  const addUser=async()=>{
    if(!isAdmin){t2("權限不足","error");return;}
    const tn=uN.trim(),tp=uP.trim();
    if(!tn||!tp){t2("請填寫帳號與密碼","error");return;}
    if(tp.length<8){t2("密碼至少 8 字元","error");return;}
    if(users.find(u=>u.name===tn)){t2("帳號已存在","error");return;}
    if(me?.role==="Admin"&&uR!=="User"){t2("Admin 只能新增 User","error");return;}
    const id="u"+Date.now();
    await fbs(`users/${id}`,{id,name:tn,pass:await hashPass(tp),role:uR});
    setUN("");setUP("");t2("✅ 帳號已建立","success");
  };
  const delUser=(u)=>{
    if(!canMgr(u)){t2("權限不足","error");return;}

                  el("td",{style:{padding:"10px 12px"}},el("div",{style:{display:"flex",gap:4,flexWrap:"wrap"}},
                    el(SBtn,{c:"edit",onClick:()=>editItem(it)},"編輯"),
                    el(SBtn,{c:"green",onClick:()=>rstItem(it)},"補庫"),
                    el(SBtn,{c:"red",onClick:()=>delItem(it)},"刪除")
                  ))
                )))
              )
            )
          ),
          // 帳號 + 補庫
          el("div",null,
            el(Card,{title:"👤 帳號管理"},
              el("div",{style:{padding:"16px 18px",display:"flex",flexDirection:"column",gap:10}},
                el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}},
                  el("div",null,el("div",{style:{fontSize:".68rem",color:C.muted,...M,marginBottom:4}},"帳號"),txtInp(uN,setUN,"帳號")),
                  el("div",null,el("div",{style:{fontSize:".68rem",color:C.muted,...M,marginBottom:4}},"密碼"),el(PwInp,{value:uP,onChange:setUP,placeholder:"至少8字元"}),el(PwStr,{pass:uP}))
                ),
                el("div",null,el("div",{style:{fontSize:".68rem",color:C.muted,...M,marginBottom:4}},"權限"),
                  el("select",{value:uR,onChange:e=>setUR(e.target.value),style:selSt},
                    el("option",{value:"User",style:{background:C.roast}},"User（現場人員）"),
                    me?.role==="Super" && el("option",{value:"Admin",style:{background:C.roast}},"Admin（管理者）"),
                    me?.role==="Super" && el("option",{value:"Super",style:{background:C.roast}},"Super（最高）")
                  )
                ),
                el(Btn,{onClick:addUser,style:{padding:"9px"}},"+ 新增帳號")
              ),
              el("table",{style:{width:"100%",borderCollapse:"collapse"}},
                el("thead",null,el("tr",null,["帳號","權限","操作"].map(h=>el("th",{key:h,style:thSt},h)))),
                el("tbody",null,users.map(u=>el("tr",{key:u.id,style:{borderBottom:"1px solid rgba(255,255,255,.04)"}},
                  el("td",{style:{padding:"10px 12px",...M,fontSize:".82rem"}},u.name, u.id===me?.id && el("span",{style:{fontSize:".62rem",color:C.muted,marginLeft:4}},"(我)")),
                  el("td",{style:{padding:"10px 12px"}},el(Tag,{label:u.role,type:u.role==="Super"?"danger":u.role==="Admin"?"warn":"safe"})),
                  el("td",{style:{padding:"10px 12px"}},el("div",{style:{display:"flex",gap:4,flexWrap:"wrap"}},
                    canMgr(u) && el(SBtn,{c:"blue",onClick:()=>rstPw(u)},"重設密碼"),
                    canMgr(u) && u.id!==me?.id && el(SBtn,{c:"red",onClick:()=>delUser(u)},"刪除"),
                    !canMgr(u) && el("span",{style:{fontSize:".7rem",color:C.muted}},"—")
                  ))
                )))
              )
            ),
            el(Card,{title:"🚚 進貨補庫",style:{marginBottom:0}},
              el("div",{style:{padding:"16px 18px",display:"flex",flexDirection:"column",gap:10}},
                el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}},
                  el("div",null,el("div",{style:{fontSize:".68rem",color:C.muted,...M,marginBottom:4}},"物料"),
                    el("select",{value:rId,onChange:e=>setRId(e.target.value),style:selSt},
                      el("option",{value:"",style:{background:C.roast}},"選擇物料"),
                      items.map(i=>el("option",{key:i.id,value:i.id,style:{background:C.roast}},i.name))
                    )
                  ),
                  el("div",null,el("div",{style:{fontSize:".68rem",color:C.muted,...M,marginBottom:4}},"進貨數量"),numInp(rQty,setRQty,"50"))
                ),
                el(Btn,{onClick:doRestock,color:"green",style:{padding:"9px"}},"+ 確認進貨")
              )
            )
          )
        )
      ),

      // ── 成本分析 ──
      page==="analytics" && el(Fragment,null,
        el("div",{style:{...S,fontSize:"1.7rem",color:C.gold,marginBottom:4}},"成本分析"),
        el("div",{style:{color:C.muted,fontSize:".76rem",marginBottom:22,...M}},"COST ANALYTICS"),
        el("div",{className:"g4",style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:16,marginBottom:20}},
          machNames.map(mn=>{
            const rs=records.filter(r=>r.machine===mn);
            const tot=rs.reduce((a,r)=>{const i=items.find(x=>x.name===r.item);return a+(i?i.price*r.qty:0);},0);
            return el("div",{key:mn,style:{background:"linear-gradient(145deg,rgba(59,31,14,.7),rgba(26,15,7,.5))",border:"1px solid rgba(196,122,43,.18)",borderRadius:14,padding:18}},
              el("div",{style:{...S,fontSize:"1.1rem",color:C.gold,marginBottom:12}},mn),
              items.map(item=>{const q=rs.filter(r=>r.item===item.name).reduce((a,r)=>a+r.qty,0);return el("div",{key:item.id,style:{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,.05)",fontSize:".78rem"}},el("span",{style:{color:C.muted,...M,fontSize:".72rem"}},item.name),el("span",{style:M},"$"+(q*item.price).toFixed(0)));})  ,
              el("hr",{style:{border:"none",borderTop:"1px solid rgba(196,122,43,.1)",margin:"6px 0"}}),
              el("div",{style:{display:"flex",justifyContent:"space-between",fontWeight:700,color:C.gold,...M,fontSize:".82rem"}},el("span",null,"本月合計"),el("span",null,"$"+tot.toFixed(0)))
            );
          })
        )
      ),

      // ── 我的帳號 ──
      page==="profile" && el(Fragment,null,
        el("div",{style:{...S,fontSize:"1.7rem",color:C.gold,marginBottom:4}},"我的帳號"),
        el("div",{style:{color:C.muted,fontSize:".76rem",marginBottom:22,...M}},"PROFILE"),
        el(Card,{title:"💾 資料備份",hint:"建議每月備份"},
          el("div",{style:{padding:"18px",display:"flex",flexDirection:"column",gap:12}},
            el("div",{style:{background:"rgba(255,255,255,.04)",borderRadius:9,padding:"12px 14px",fontSize:".8rem",color:C.muted,lineHeight:1.9,...M}},
              "📦 物料：",el("strong",{style:{color:C.cream}},items.length+"項"),
              " 📋 紀錄：",el("strong",{style:{color:C.cream}},records.length+"筆"),
              " 👤 帳號：",el("strong",{style:{color:C.cream}},users.length+"個")
            ),
            el(Btn,{onClick:backup,color:"green",style:{padding:"11px"}},"📥 立即下載備份檔")
          )
        ),
        el("div",{className:"g2",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}},
          el(Card,{title:"📋 帳號資訊"},
            el("div",{style:{padding:"18px"}},
              [["帳號",me?.name],["權限",me?.role],["樓層",me?.floor],["登入時間",me?.loginAt?new Date(me.loginAt).toLocaleString("zh-TW"):"—"],["自動登出",SESS_MIN+"分鐘"]].map(([l,v])=>
                el("div",{key:l,style:{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}},
                  el("span",{style:{fontSize:".78rem",color:C.muted,...M}},l),
                  el("span",{style:{fontSize:".84rem",color:C.cream,...M}},v)
                )
              )
            )
          ),
          el(Card,{title:"🔑 修改密碼"},
            el("div",{style:{padding:"18px",display:"flex",flexDirection:"column",gap:12}},
              el("div",null,el("div",{style:{fontSize:".68rem",color:C.muted,...M,marginBottom:4}},"目前密碼"),el(PwInp,{value:po,onChange:setPo,placeholder:"目前密碼"})),
              el("div",null,el("div",{style:{fontSize:".68rem",color:C.muted,...M,marginBottom:4}},"新密碼"),el(PwInp,{value:pn,onChange:setPn,placeholder:"至少8字元"}),el(PwStr,{pass:pn})),
              el("div",null,
                el("div",{style:{fontSize:".68rem",color:C.muted,...M,marginBottom:4}},"確認新密碼"),
                el(PwInp,{value:pc,onChange:setPc,placeholder:"再輸入一次"}),
                pc&&pn!==pc && el("div",{style:{fontSize:".68rem",color:"#e74c3c",...M,marginTop:3}},"⚠️ 不一致"),
                pc&&pn===pc&&pc.length>0 && el("div",{style:{fontSize:".68rem",color:"#2ecc71",...M,marginTop:3}},"✓ 一致")
              ),
              el(Btn,{onClick:changePw,color:"green",style:{padding:"10px"}},"🔑 確認修改")
            )
          )
        )
      )
    ),

    // Modal & Toast
    modal && el(Modal,{title:modal.title,body:modal.body,okRed:modal.okRed,okLabel:modal.okLabel,onOk:()=>{modal.onOk();setModal(null);},onClose:()=>setModal(null)}),
    el(Toast,{msg:toast.msg,type:toast.type})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
